<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5a45" />
  <title>Treasure Hunt Adventure</title>
    <style>
    :root{
      --ink:#2b2118; --paper:#fff5d9; --paper2:#f1ddb1; --green:#1f5a45;
      --green2:#2d765c; --gold:#f2b84b; --red:#b84f43; --blue:#2f6f8f;
      --shadow:0 10px 28px rgba(43,33,24,.18);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;background:#efe4c7;color:var(--ink);min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;background:radial-gradient(circle at 20% 0,#fff8e7 0,#efe1bd 48%,#dfc995 100%)}
    .topbar{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(31,90,69,.96);color:white;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px rgba(0,0,0,.16)}
    .brand{font-weight:900;letter-spacing:.4px}.tiny{font-size:12px;opacity:.86}
    .screen{max-width:720px;margin:0 auto;padding:22px 16px calc(30px + env(safe-area-inset-bottom))}
    .card{background:linear-gradient(180deg,#fffaf0,#fff0c8);border:2px solid rgba(83,58,29,.22);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
    .hero{text-align:center;padding:26px 18px}.hero .big{font-size:62px;line-height:1;margin-bottom:10px}.hero h1{font-size:32px;margin:4px 0 8px}.hero p{font-size:17px;line-height:1.45;margin:0 auto 18px;max-width:530px}
    .btn{border:0;border-radius:18px;padding:15px 18px;font-weight:900;font-size:17px;min-height:54px;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:.12s transform,.12s opacity;width:100%}
    .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
    .btn.primary{background:var(--green);color:white}.btn.gold{background:var(--gold);color:#3c2811}.btn.red{background:var(--red);color:white}.btn.blue{background:var(--blue);color:white}.btn.ghost{background:#fff9ea;color:var(--ink);border:2px solid rgba(43,33,24,.18)}
    .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stack{display:grid;gap:10px}
    .code{font-size:38px;font-weight:1000;letter-spacing:7px;text-align:center;background:#fff;border:3px dashed var(--green);border-radius:18px;padding:14px;margin:12px 0}
    .label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;opacity:.65;margin-bottom:6px}
    .input{width:100%;border:2px solid rgba(43,33,24,.22);border-radius:16px;padding:15px 16px;font-size:22px;text-transform:uppercase;letter-spacing:4px;text-align:center;background:white}
    .status{border-radius:16px;padding:12px 14px;font-weight:800;margin:10px 0;background:#fff7de;border:1px solid rgba(43,33,24,.14)}
    .status.ok{background:#e7f5ea;color:#18472f}.status.wait{background:#fff0c7;color:#68470b}.status.bad{background:#fde7e4;color:#7d2d23}
    .qrwrap{background:white;border-radius:20px;padding:14px;display:flex;justify-content:center;margin:10px auto;max-width:280px;min-height:240px;align-items:center}
    .progress{height:15px;border-radius:999px;background:#dfcfaa;overflow:hidden;margin:8px 0 18px}.progress>div{height:100%;background:linear-gradient(90deg,var(--green),#5ca77c);transition:width .35s ease}
    .clueicon{font-size:72px;text-align:center}.clue h2{text-align:center;font-size:29px;margin:7px 0}.clueText{text-align:center;font-size:23px;line-height:1.3;font-weight:900;margin:10px 0 18px}.hint{font-size:16px;line-height:1.4;background:#fff8df;border-radius:16px;padding:12px 14px;border:1px dashed rgba(43,33,24,.32)}
    .cameraBox{background:#181818;border-radius:22px;overflow:hidden;aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;color:white;box-shadow:var(--shadow)}
    video{width:100%;height:100%;object-fit:cover;background:#111}.cameraPlaceholder{text-align:center;padding:20px;font-weight:800}.cameraPlaceholder .cam{font-size:54px}
    .foundBtn{font-size:24px;min-height:70px;margin-top:12px}
    .parentTarget{text-align:center}.parentTarget .emoji{font-size:52px}.parentTarget h2{margin:4px 0 2px}.parentTarget p{margin:0;font-weight:700;opacity:.72}
    .liveBadge{position:absolute;top:12px;left:12px;background:#c93d35;color:white;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:1000;letter-spacing:.6px}
    .mapImg{width:100%;border-radius:18px;border:2px solid rgba(43,33,24,.2);display:block}.mapCaption{text-align:center;font-weight:800;margin-top:8px;font-size:13px;opacity:.7}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{padding:12px;border:0;border-radius:14px;font-weight:900;background:#dbc79a;color:#513a22}.tab.active{background:var(--green);color:white}
    .hidden{display:none!important}.center{text-align:center}.muted{opacity:.68}.small{font-size:13px}.largeEmoji{font-size:84px}
    .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#253f32;color:white;border-radius:999px;padding:13px 18px;font-weight:900;z-index:30;transition:.28s;max-width:90%;text-align:center;box-shadow:var(--shadow)}.toast.show{transform:translateX(-50%) translateY(0)}
    .celebrate{animation:pop .55s ease both}@keyframes pop{0%{transform:scale(.75);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
    .digScene{position:relative;height:480px;border-radius:24px;overflow:hidden;background:linear-gradient(#79b65a 0 14%,#8bc668 14% 18%,#b7793d 18% 100%);box-shadow:var(--shadow);touch-action:none}
    .digSky{text-align:center;padding:14px 8px 0;color:#fff;font-weight:1000;text-shadow:0 2px 3px rgba(0,0,0,.25)}
    .treasure{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:115px;filter:drop-shadow(0 9px 7px rgba(0,0,0,.25));transition:.5s;z-index:1}.treasure.open{transform:translate(-50%,-50%) scale(1.16) rotate(-2deg)}
    #digCanvas{position:absolute;left:0;top:18%;width:100%;height:82%;z-index:2;touch-action:none}
    .digInstruction{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(255,249,228,.92);border-radius:999px;padding:10px 16px;font-weight:1000;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .confetti{position:absolute;z-index:5;font-size:28px;animation:fall 1.8s ease-out forwards;pointer-events:none}@keyframes fall{0%{transform:translateY(-50px) rotate(0);opacity:1}100%{transform:translateY(450px) rotate(520deg);opacity:0}}
    .successPanel{background:linear-gradient(180deg,#eaf9eb,#fff7d6);border:3px solid #4f9a65;text-align:center}
    .list{display:grid;gap:8px}.stepRow{display:flex;gap:10px;align-items:center;background:#fff8e7;border-radius:14px;padding:10px 12px;border:1px solid rgba(43,33,24,.12)}.stepNum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dfcfaa;font-weight:1000}.stepRow.done .stepNum{background:var(--green);color:white}.stepRow.current{outline:3px solid rgba(242,184,75,.55)}
    .dangerNote{background:#fff0e7;border:1px solid #e0a182;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.35}
    @media(max-width:430px){.hero h1{font-size:28px}.clueText{font-size:21px}.digScene{height:440px}.code{font-size:32px}.btnrow{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar"><div><div class="brand">🧭 Treasure Hunt</div><div class="tiny" id="topSub">Adventure game</div></div><div id="connectionDot">⚪</div></div>
  <main class="screen" id="screen"></main>
  <div class="toast" id="toast"></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== HUNT CONTENT: edit these locations/clues if you want to change the route. =====
const HUNT = [
  {title:"Front Door", icon:"🚪", clue:"Find the door that takes you from inside to the FRONT of the house!", hint:"Look for the door you use when going out to the front."},
  {title:"Red Front Gate", icon:"🔴", clue:"Now find the BIG RED GATE where visitors and cars can come in!", hint:"Go outside and look toward the front boundary."},
  {title:"Kitchen Fridge", icon:"🧊", clue:"Find the tall, cold cupboard where food and drinks stay chilly!", hint:"It is in the kitchen."},
  {title:"Washing Line", icon:"👕", clue:"Find the place where wet clothes hang and dance in the wind!", hint:"Go to the backyard and look up."},
  {title:"Trampoline", icon:"🤸", clue:"Find the place where you can BOUNCE up, up, up!", hint:"It is outside in the backyard."},
  {title:"Braai Area", icon:"🔥", clue:"Find the place where the grown-ups cook yummy food outside!", hint:"Look for the outdoor cooking place."},
  {title:"Green Water Tank", icon:"🟢", clue:"Final mission! Find the BIG GREEN TANK. The treasure is hiding beneath the virtual ground!", hint:"Look toward the back area near the building."}
];

const $ = s => document.querySelector(s);
const screen = $('#screen');
const toastEl = $('#toast');
let role = null, peer = null, conn = null, mediaCall = null, localStream = null;
let step = 0, pendingFound = false, gameStarted = false;
let parentVideoStream = null;

function setConn(ok){ $('#connectionDot').textContent = ok ? '🟢' : '⚪'; }
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),2200); }
function code6(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function baseUrl(){ return location.href.split('?')[0].split('#')[0]; }
function speak(text){ if(!('speechSynthesis' in window)){toast('Voice not available on this phone');return;} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.84; u.pitch=1.08; speechSynthesis.speak(u); }
function beep(freq=620, dur=.11){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.stop(a.currentTime+dur);}catch(e){} }
function send(obj){ if(conn && conn.open) conn.send(obj); }
function resetScreen(){ if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; } if(mediaCall){try{mediaCall.close()}catch(e){} mediaCall=null;} }

function landing(){
  $('#topSub').textContent='Choose a phone';
  screen.innerHTML=`
    <div class="card hero celebrate">
      <div class="big">🗺️</div><h1>Treasure Hunt Adventure</h1>
      <p>One phone becomes the <b>Parent Control</b>. The other becomes the little explorer's game.</p>
      <div class="stack">
        <button class="btn primary" onclick="startParent()">👨‍👩‍👦 Parent Control</button>
        <button class="btn gold" onclick="showJoin()">🧭 Explorer Phone</button>
      </div>
    </div>
    <div class="card center small muted">No clue cards need to be hidden outside. The explorer uses the camera and the parent approves each location.</div>`;
}

function startParent(){
  role='parent'; const c=code6();
  $('#topSub').textContent='Parent Control';
  screen.innerHTML=`
    <div class="card center"><div class="label">Your game code</div><div class="code">${c}</div>
      <div class="status wait" id="pStatus">Creating the game…</div>
      <div id="qr" class="qrwrap"><span class="muted">Preparing QR…</span></div>
      <p class="small muted">On the explorer phone, scan this QR or open the game and enter <b>${c}</b>.</p>
    </div>`;
  try{
    peer = new Peer('treasure-parent-'+c.toLowerCase());
    peer.on('open',()=>{
      $('#pStatus').textContent='Waiting for the explorer phone…';
      const joinURL = baseUrl()+'?join='+encodeURIComponent(c);
      const qr=$('#qr'); qr.innerHTML='';
      new QRCode(qr,{text:joinURL,width:220,height:220,colorDark:'#1f5a45',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    });
    peer.on('connection', cconn=>{
      conn=cconn; wireParentConnection();
    });
    peer.on('call', call=>{
      mediaCall=call; call.answer();
      call.on('stream',stream=>{parentVideoStream=stream; const v=$('#parentLive'); if(v){v.srcObject=stream;v.play().catch(()=>{});} });
      call.on('close',()=>{ parentVideoStream=null; renderParentGame(); });
    });
    peer.on('error',e=>{ const s=$('#pStatus'); if(s)s.textContent='Connection problem: '+e.type; });
  }catch(e){ $('#pStatus').textContent='Could not start connection. Make sure you are online.'; }
}

function wireParentConnection(){
  setConn(true); $('#pStatus') && ($('#pStatus').textContent='Explorer connected! 🎉');
  conn.on('data',data=>{
    if(data.type==='ready'){ renderParentLobby(); }
    if(data.type==='found'){ pendingFound=true; step=data.step; renderParentGame(); beep(720,.13); }
    if(data.type==='cameraStarted'){ renderParentGame(); }
    if(data.type==='cameraStopped'){ parentVideoStream=null; renderParentGame(); }
    if(data.type==='digDone'){ renderParentFinished(); }
  });
  conn.on('close',()=>{setConn(false);toast('Explorer disconnected');});
  send({type:'hello',hunt:HUNT});
}

function parentStartGame(){ gameStarted=true; step=0; pendingFound=false; send({type:'start'}); renderParentGame(); }

function renderParentGame(){
  if(!gameStarted){renderParentLobby();return;}
  const item=HUNT[Math.min(step,HUNT.length-1)];
  const pct=Math.round((step/HUNT.length)*100);
  screen.innerHTML=`
    <div class="card parentTarget">
      <div class="label">Explorer progress</div><div class="progress"><div style="width:${pct}%"></div></div>
      <div class="emoji">${item.icon}</div><h2>${item.title}</h2><p>Location ${step+1} of ${HUNT.length}</p>
    </div>
    <div class="cameraBox" id="parentCamBox">
      <video id="parentLive" autoplay playsinline muted></video>
      ${parentVideoStream?'':'<div class="cameraPlaceholder"><div class="cam">📷</div>Waiting for the explorer to turn on the camera…</div>'}
      ${parentVideoStream?'<div class="liveBadge">● LIVE</div>':''}
    </div>
    <div class="card ${pendingFound?'':'hidden'}" id="approvalCard">
      <div class="center"><div class="largeEmoji">👀</div><h2>He says he found it!</h2><p>Check the live camera. Is this <b>${item.title}</b>?</p></div>
      <div class="btnrow"><button class="btn primary" onclick="approveFound()">✅ FOUND IT</button><button class="btn red" onclick="rejectFound()">🔄 TRY AGAIN</button></div>
    </div>
    <div class="card"><div class="btnrow"><button class="btn gold" onclick="sendHint()">💡 Send Hint</button><button class="btn ghost" onclick="showParentMap()">🗺️ Map</button></div>
      <button class="btn ghost" style="margin-top:10px" onclick="forceNext()">⏭️ Parent Skip / Unlock</button></div>
    <div class="card"><div class="label">Route</div><div class="list">${HUNT.map((x,i)=>`<div class="stepRow ${i<step?'done':''} ${i===step?'current':''}"><div class="stepNum">${i<step?'✓':i+1}</div><div><b>${x.icon} ${x.title}</b></div></div>`).join('')}</div></div>`;
  if(parentVideoStream){ const v=$('#parentLive'); v.srcObject=parentVideoStream; v.play().catch(()=>{}); }
}
function approveFound(){
  pendingFound=false; beep(880,.16);
  if(step>=HUNT.length-1){ send({type:'approvedFinal'}); step=HUNT.length; renderParentWaitingDig(); }
  else { send({type:'approved',step}); step++; renderParentGame(); }
}
function rejectFound(){ pendingFound=false; send({type:'retry'}); renderParentGame(); }
function sendHint(){ send({type:'hint',text:HUNT[Math.min(step,HUNT.length-1)].hint}); toast('Hint sent 💡'); }
function forceNext(){ pendingFound=true; approveFound(); }

 screen.innerHTML=`<div class="card hero successPanel celebrate"><div class="big">🏆</div><h1>Treasure Found!</h1><p>The mission is complete. Give your little explorer a big celebration!</p><button class="btn gold" onclick="location.reload()">🔁 New Game</button></div>`;

function showJoin(prefill=''){
  role='child'; $('#topSub').textContent='Explorer';
  screen.innerHTML=`<div class="card hero"><div class="big">🧭</div><h1>Explorer Phone</h1><p>Enter the 6-letter game code shown on the parent's phone.</p>
    <input id="joinCode" class="input" maxlength="6" autocomplete="off" value="${prefill}" placeholder="ABC123">
    <button class="btn gold" style="margin-top:12px" onclick="joinGame()">🚀 JOIN ADVENTURE</button>
    <div class="status wait hidden" id="joinStatus"></div></div>`;
  if(prefill) setTimeout(joinGame,200);
}
function joinGame(){
  const c=($('#joinCode').value||'').trim().toLowerCase(); if(c.length<4){toast('Enter the game code');return;}
  const st=$('#joinStatus'); st.classList.remove('hidden');st.textContent='Connecting to Parent…';
  peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect('treasure-parent-'+c,{reliable:true}); wireChildConnection();
  });
  peer.on('error',e=>{st.textContent='Could not connect. Check the code and internet.';});
}
function wireChildConnection(){
  conn.on('open',()=>{ setConn(true); send({type:'ready'}); renderChildWaiting(); });
  conn.on('data',data=>{
    if(data.type==='start'){gameStarted=true;step=0;renderChildClue();announceClue();}
    if(data.type==='approved'){ celebrateLocation(); }
    if(data.type==='approvedFinal'){ stopCamera(); showDigGame(); }
    if(data.type==='retry'){ pendingFound=false; toast('Not quite — keep looking! 🔎'); renderChildClue(); }
    if(data.type==='hint'){ showHintPopup(data.text); }
  });
  conn.on('close',()=>{setConn(false);toast('Parent phone disconnected');});
}
function renderChildWaiting(){
 screen.innerHTML=`<div class="card hero celebrate"><div class="big">🏴‍☠️</div><h1>You’re connected!</h1><p>Explorer, get ready. The adventure will begin when Parent presses START.</p><div class="status wait">Waiting for Parent…</div></div>`;
}
function renderChildClue(){
 const item=HUNT[step], pct=Math.round((step/HUNT.length)*100);
 screen.innerHTML=`
  <div class="card clue celebrate"><div class="label center">Mission ${step+1} of ${HUNT.length}</div><div class="progress"><div style="width:${pct}%"></div></div>
    <div class="clueicon">${item.icon}</div><h2>${item.title}</h2><div class="clueText">${item.clue}</div>
    <button class="btn blue" onclick="speak(HUNT[step].clue)">🔊 HEAR THE CLUE</button>
  </div>
  <div id="childCameraArea">
   <div class="cameraBox"><video id="childVideo" autoplay playsinline muted></video><div class="cameraPlaceholder" id="childCamPlaceholder"><div class="cam">📷</div>When you get there, turn on the camera and point it at what you found.</div></div>
   <button class="btn primary foundBtn" id="camBtn" onclick="startCamera()">📷 TURN ON CAMERA</button>
   <button class="btn gold foundBtn hidden" id="foundBtn" onclick="foundIt()">⭐ I FOUND IT!</button>
  </div>
  <div class="card center"><button class="btn ghost" onclick="childMap()">🗺️ Look at the Adventure Map</button></div>`;
}
function announceClue(){ setTimeout(()=>speak(HUNT[step].clue),400); }
async function startCamera(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$('#childVideo'); v.srcObject=localStream; await v.play();
    const ph=$('#childCamPlaceholder'); if(ph)ph.remove();
    $('#camBtn').classList.add('hidden'); $('#foundBtn').classList.remove('hidden');
    mediaCall=peer.call(conn.peer,localStream);
    send({type:'cameraStarted'}); beep(520,.08);
  }catch(e){
    toast('Camera permission is needed. Tap Allow.');
  }
}
function stopCamera(){
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(mediaCall){try{mediaCall.close()}catch(e){} mediaCall=null;}
  send({type:'cameraStopped'});
}
function foundIt(){
  pendingFound=true; send({type:'found',step});
  const b=$('#foundBtn'); if(b){b.disabled=true;b.textContent='⏳ PARENT IS CHECKING…';b.style.opacity=.7;}
  toast('Parent is checking! 👀');
}
function celebrateLocation(){
  stopCamera(); pendingFound=false;
  screen.innerHTML=`<div class="card hero successPanel celebrate"><div class="big">🌟</div><h1>YOU FOUND IT!</h1><p>Great exploring!</p><div class="largeEmoji">🪙 🪙 🪙</div></div>`;
  beep(880,.18); setTimeout(()=>{step++;renderChildClue();announceClue();},1800);
}

function showDigGame(){
 $('#topSub').textContent='FINAL TREASURE DIG';
 screen.innerHTML=`
  <div class="card clue celebrate"><div class="clueicon">⛏️</div><h2>X Marks the Spot!</h2><div class="clueText">Use your finger to DIG through the ground and find the treasure!</div></div>
  <div class="digScene" id="digScene"><div class="digSky">🌴 SECRET TREASURE GROUND 🌴</div><div class="treasure" id="treasure">🔒🧰</div><canvas id="digCanvas"></canvas><div class="digInstruction" id="digInstruction">👆 Swipe to dig!</div></div>
  <div class="card center small muted">Keep swiping the brown ground until the chest appears.</div>`;
  setupDig(); speak('X marks the spot! Use your finger to dig for the treasure!');
}
function setupDig(){
 const canvas=$('#digCanvas'), scene=$('#digScene');
 const rect=scene.getBoundingClientRect(); const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*.82*dpr);
 const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); const w=rect.width,h=rect.height*.82;
 ctx.fillStyle='#9b5d31';ctx.fillRect(0,0,w,h);
 // dirt texture
 for(let i=0;i<220;i++){ ctx.globalAlpha=.25+Math.random()*.25;ctx.fillStyle=Math.random()>.5?'#6f4429':'#c08046';ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,2+Math.random()*8,0,Math.PI*2);ctx.fill(); }
 ctx.globalAlpha=1;ctx.globalCompositeOperation='destination-out';
 let dragging=false, strokes=0, won=false;
 const dig=(ev)=>{if(!dragging||won)return; const r=canvas.getBoundingClientRect(); const p=ev.touches?ev.touches[0]:ev; const x=p.clientX-r.left,y=p.clientY-r.top;ctx.beginPath();ctx.arc(x,y,34,0,Math.PI*2);ctx.fill();strokes++; if(strokes>70){won=true; finishDig();}};
 canvas.addEventListener('pointerdown',e=>{dragging=true;dig(e);});canvas.addEventListener('pointermove',dig);window.addEventListener('pointerup',()=>dragging=false);
 canvas.addEventListener('touchstart',e=>{dragging=true;dig(e);},{passive:true});canvas.addEventListener('touchmove',dig,{passive:true});window.addEventListener('touchend',()=>dragging=false);
}
function finishDig(){
 const c=$('#digCanvas'); c.style.transition='opacity .8s';c.style.opacity='0';
 $('#treasure').textContent='💰';$('#treasure').classList.add('open');$('#digInstruction').textContent='🎉 TREASURE FOUND!';
 confettiBurst();beep(980,.2);speak('Treasure found! Mission complete!');send({type:'digDone'});
 setTimeout(()=>{
   screen.insertAdjacentHTML('beforeend',`<div class="card hero successPanel celebrate"><div class="big">🏆</div><h1>TREASURE FOUND!</h1><p>You completed the whole adventure!</p><div class="largeEmoji">✨🪙💎🪙✨</div></div>`);
 },800);
}
function confettiBurst(){
 const host=$('#digScene')||document.body; const icons=['⭐','✨','🪙','🎉','💎'];
 for(let i=0;i<24;i++){const s=document.createElement('span');s.className='confetti';s.textContent=icons[i%icons.length];s.style.left=(5+Math.random()*90)+'%';s.style.top='0px';s.style.animationDelay=(Math.random()*.45)+'s';host.appendChild(s);setTimeout(()=>s.remove(),2500);}
}

// Auto-join when the dynamic QR is scanned.
const params=new URLSearchParams(location.search); const join=params.get('join');
if(join) showJoin(join.toUpperCase()); else landing();
